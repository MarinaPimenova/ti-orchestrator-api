server:
  port: ${SERVER_PORT:8082}
  address: 0.0.0.0 # Binds to all network interfaces so Docker bridge can connect
  servlet:
    context-path: /
    session:
      timeout: 3600 # redefine default 30m by 1 hour

info:
  app:
    name: ti-orchestrator-api
    version: '@project.version@'

spring:
  application:
    name: ${info.app.name}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${OKTA_DOMAIN}/
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

file:
  upload:
    directory: ./storage/import

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,zipkin
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.wk.ti: debug
    org.springframework: info
  # Enable Native JSON Structured Logging (Spring Boot 3.4+)
  structured:
    format:
      console: ecs # Emits logs in ECS JSON format containing service, traceId, spanId

ms:
  cors:
    allowed-origins: "${SWAGGER_ALLOWED_ORIGINS:http://localhost:8080}"

springdoc:
  api-docs:
    path: /v3/api-docs

group:
  admin:
    - mnfpma