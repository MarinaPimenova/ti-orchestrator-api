server:
  port: ${SERVER_PORT:8082}

info:
  app:
    name: test-app
    version: '@project.version@'

spring:
  application:
    name: ${info.app.name:test-app}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    prometheus:
      access: read_only

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.wk.ti: debug
    org.springframework: info
  # Enable Native JSON Structured Logging (Spring Boot 3.4+)
  structured:
    format:
      console: ecs # Emits logs in ECS JSON format containing service, traceId, spanId

ms:
  cors:
    allowed-origins: "${SWAGGER_ALLOWED_ORIGINS:http://localhost:8080}"

springdoc:
  api-docs:
    path: /v3/api-docs

group:
  admin: test